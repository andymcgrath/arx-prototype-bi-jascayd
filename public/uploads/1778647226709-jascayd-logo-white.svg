<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" width="800" height="400">

  <!-- Icon: stylized swoosh, all white with varying opacity -->
  <g transform="translate(20, 48)">
    <path d="M8,138 Q55,88 148,108 Q95,122 52,148 Z" fill="white" opacity="0.55"/>
    <path d="M12,116 Q62,60 158,80 Q108,98 48,126 Z" fill="white" opacity="0.68"/>
    <path d="M18,94 Q75,32 168,52 Q118,74 48,104 Z" fill="white" opacity="0.80"/>
    <path d="M28,72 Q90,10 178,30 Q130,54 58,84 Z" fill="white" opacity="0.90"/>
    <path d="M42,50 Q110,-8 192,12 Q146,38 72,62 Z" fill="white" opacity="1.0"/>
  </g>

  <!-- JASCAYD — textLength pins it to exactly 540px, preventing overflow -->
  <text
    x="192"
    y="202"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="118"
    font-weight="bold"
    font-style="italic"
    fill="white"
    textLength="540"
    lengthAdjust="spacingAndGlyphs"
  >JASCAYD</text>

  <!-- ® superscript -->
  <text
    x="740"
    y="152"
    font-family="Georgia, serif"
    font-size="30"
    fill="white"
  >®</text>

  <!-- Generic name -->
  <text
    x="400"
    y="268"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="46"
    fill="white"
    text-anchor="middle"
    font-style="italic"
  >(nerandomilast)</text>

  <!-- Dosage -->
  <text
    x="400"
    y="326"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="36"
    fill="white"
    text-anchor="middle"
  >tablets 18 mg</text>

</svg>
